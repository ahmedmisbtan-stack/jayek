services:
  - type: web
    name: jayek-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: jayek-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://jayek-api.onrender.com
      - key: ALLOW_DEV_HEADERS
        value: "false"
      - key: PAYMENT_PROVIDER
        value: cod
      - key: OTP_PROVIDER
        value: console
      - key: DEMO_OTP_ENABLED
        value: "true"
      - key: DEMO_OTP_CODE
        value: "2468"
      - key: DEMO_OTP_PHONES
        value: 01000000001,01000000002,01000000003,01000000004
      - key: PUSH_PROVIDER
        value: console
      - key: MAP_PROVIDER
        value: haversine
      - key: STORAGE_PROVIDER
        value: local
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "120"

databases:
  - name: jayek-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: jayek
    user: jayek
