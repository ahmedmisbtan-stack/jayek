name: Bayynat Android APK

on:
  push:
    branches:
      - main
      - feature/bayynat-native-foundation
    paths:
      - "apps/bayynat-android/**"
      - ".github/workflows/bayynat-android.yml"
  pull_request:
    paths:
      - "apps/bayynat-android/**"
      - ".github/workflows/bayynat-android.yml"
  workflow_dispatch:

concurrency:
  group: bayynat-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: apps/bayynat-android
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bayynat-debug-apk
          path: apps/bayynat-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
