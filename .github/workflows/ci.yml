name: JAYEK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jayek-ci-main
  cancel-in-progress: true

jobs:
  api:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  customer:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.jayek --project-name app .
      - name: Patch Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<application'
          perms=['<uses-permission android:name="android.permission.INTERNET"/>','<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>','<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>']
          for perm in reversed(perms):
              if perm not in s:
                  s=s.replace(marker,perm+'\\n    '+marker,1)
          p.write_text(s)
          PY
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=JAYEK_API=https://example.invalid/api/v1
      - name: Build release APK
        run: flutter build apk --release --dart-define=JAYEK_API=https://example.invalid/api/v1
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: jayek-customer-apks
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  rider:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.jayek --project-name rider .
      - name: Patch Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<application'
          perms=['<uses-permission android:name="android.permission.INTERNET"/>','<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>','<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>']
          for perm in reversed(perms):
              if perm not in s:
                  s=s.replace(marker,perm+'\\n    '+marker,1)
          p.write_text(s)
          PY
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=JAYEK_API=https://example.invalid/api/v1
      - name: Build release APK
        run: flutter build apk --release --dart-define=JAYEK_API=https://example.invalid/api/v1
      - name: Upload rider APK
        uses: actions/upload-artifact@v4
        with:
          name: jayek-rider-apks
          path: |
            apps/rider/build/app/outputs/flutter-apk/app-debug.apk
            apps/rider/build/app/outputs/flutter-apk/app-release.apk

