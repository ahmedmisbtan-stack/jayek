name: Bayynat Android Lint

on:
  push:
    branches:
      - feature/bayynat-native-foundation
    paths:
      - "apps/bayynat-android/**"
      - ".github/workflows/bayynat-lint.yml"

concurrency:
  group: bayynat-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run Android lint
        continue-on-error: true
        working-directory: apps/bayynat-android
        run: gradle :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayynat-lint-report
          path: apps/bayynat-android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
