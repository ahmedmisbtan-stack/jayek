name: Materialize JAYEK source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upload archive
        shell: bash
        run: test -f jayek-github-upload.zip

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jayek-upload
          mkdir -p /tmp/jayek-upload
          unzip -q jayek-github-upload.zip -d /tmp/jayek-upload
          SRC=/tmp/jayek-upload/jayek-github-upload
          test -d "$SRC"
          cp -a "$SRC"/. .
          rm -rf .github/workflows
          rm -f jayek-github-upload.zip
          rm -f jayek-source.part01 jayek-source.part02 jayek-source.part03 jayek-source.part04                 jayek-source.part05 jayek-source.part06 jayek-source.part07 jayek-source.part08                 jayek-source.b64 jayek-source.tar.gz
          rm -f MATERIALIZE_TRIGGER.md

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JAYEK Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "Materialize JAYEK project source"
          git push
