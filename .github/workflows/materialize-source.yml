name: Materialize JAYEK source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ hashFiles('jayek-source.part01', 'jayek-source.part02', 'jayek-source.part03', 'jayek-source.part04', 'jayek-source.part05', 'jayek-source.part06', 'jayek-source.part07', 'jayek-source.part08') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat jayek-source.part01               jayek-source.part02               jayek-source.part03               jayek-source.part04               jayek-source.part05               jayek-source.part06               jayek-source.part07               jayek-source.part08 > jayek-source.b64
          base64 -d jayek-source.b64 > jayek-source.tar.gz
          tar -xzf jayek-source.tar.gz
          rm -f jayek-source.part01 jayek-source.part02 jayek-source.part03 jayek-source.part04                 jayek-source.part05 jayek-source.part06 jayek-source.part07 jayek-source.part08                 jayek-source.b64 jayek-source.tar.gz

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JAYEK Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized source changes."
            exit 0
          fi
          git commit -m "Materialize JAYEK project source"
          git push
