name: Gemini Agent Bridge

on:
  push:
    paths:
      - "gemini_tasks/inbox/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-gemini:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest task
        id: task
        shell: bash
        run: |
          file=$(find gemini_tasks/inbox -type f -name '*.md' | sort | tail -n 1)
          if [ -z "$file" ]; then
            echo "No task found"
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Send task to Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_FILE: ${{ steps.task.outputs.file }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is not configured."
            exit 1
          fi

          python - <<'PY'
          import json, os
          task = open(os.environ["TASK_FILE"], encoding="utf-8").read()
          body = {
              "agent": "antigravity-preview-09-2026",
              "input": [{"type": "text", "text": task}],
              "environment": {"type": "remote"},
              "background": True
          }
          open("/tmp/request.json", "w", encoding="utf-8").write(json.dumps(body))
          PY

          curl -sS --fail-with-body -X POST "https://generativelanguage.googleapis.com/v1beta/interactions"             -H "Content-Type: application/json"             -H "x-goog-api-key: $GEMINI_API_KEY"             -H "Api-Revision: 2026-05-20"             --data-binary @/tmp/request.json             > /tmp/response.json

          python - <<'PY'
          import json
          data=json.load(open("/tmp/response.json", encoding="utf-8"))
          interaction_id=data.get("id")
          if not interaction_id:
              raise SystemExit("Gemini did not return an interaction id: "+json.dumps(data, ensure_ascii=False))
          print("Started Gemini interaction:", interaction_id)
          open("/tmp/interaction_id","w",encoding="utf-8").write(interaction_id)
          PY

          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Gemini interaction timed out after 30 minutes."
              exit 1
            fi

            curl -sS --fail-with-body "https://generativelanguage.googleapis.com/v1beta/interactions/$(cat /tmp/interaction_id)"               -H "x-goog-api-key: $GEMINI_API_KEY"               -H "Api-Revision: 2026-05-20"               > /tmp/response.json

            status=$(python - <<'PY'
          import json
          print(json.load(open("/tmp/response.json", encoding="utf-8")).get("status",""))
          PY
            )
            echo "Gemini status: $status"

            if [ "$status" = "completed" ]; then
              break
            fi
            if [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then
              cat /tmp/response.json
              exit 1
            fi
            sleep 10
          done

          mkdir -p gemini_tasks/results

          python - <<'PY'
          import json
          data=json.load(open("/tmp/response.json", encoding="utf-8"))
          text=data.get("output_text")
          if not text:
              parts=[]
              for step in data.get("steps", []):
                  for item in step.get("content", []):
                      if item.get("type") == "text":
                          parts.append(item.get("text",""))
              text="\n\n".join(parts).strip()
          if not text:
              text=json.dumps(data, ensure_ascii=False, indent=2)
          open("gemini_tasks/results/latest.md","w",encoding="utf-8").write(
              "# Gemini Result\n\n"+text+"\n"
          )
          PY

      - name: Commit result
        shell: bash
        run: |
          git config user.name "gemini-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini_tasks/results/latest.md
          git commit -m "Run Gemini agent task" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
