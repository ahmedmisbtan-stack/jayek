<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جايك — مركز التشغيل</title><style>:root{--g:#176B4D;--gl:#65B87A;--o:#F39A3D;--c:#FFF8EA;--t:#202522}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--c);color:var(--t)}header{background:linear-gradient(120deg,var(--g),#0e5139);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}main{max-width:1300px;margin:auto;padding:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button,.primary{border:0;border-radius:12px;padding:11px 16px;background:#fff;color:var(--g);font-weight:800;cursor:pointer}.tabs button.active,.primary{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 22px #0000000b;margin-bottom:14px}.metric{font-size:30px;font-weight:900;color:var(--g)}table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid #eee;text-align:right}select,input,textarea{padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#6d756f}.ok{color:var(--g)}.warn{color:#b96b12}.danger{color:#a33}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef7f1;color:var(--g);font-size:12px;font-weight:800}.section{margin-top:24px}button.small{padding:7px 10px;border:0;border-radius:9px;background:#eef7f1;color:var(--g);font-weight:800;cursor:pointer}</style></head><body><header><div><strong style="font-size:25px">جايك</strong><div>مركز التشغيل</div></div><div>JAYEK OPS · v3.3</div></header><main><div class="tabs"><button class="active" onclick="show('admin',this)">مركز العمليات</button><button onclick="show('bi',this)">التقارير</button><button onclick="show('live',this)">الطلبات الحية</button><button onclick="show('zones',this)">مناطق التوصيل</button><button onclick="show('merchant',this)">التاجر</button><button onclick="show('rider',this)">الكابتن</button></div><section id="bi" hidden><div class="card"><div class="row"><input id="biUser" placeholder="Admin Access Token" style="min-width:310px"><select id="biDays"><option value="7">7 أيام</option><option value="30" selected>30 يومًا</option><option value="90">90 يومًا</option><option value="365">سنة</option></select><button class="primary" onclick="loadBI()">تحميل التقارير</button><button class="small" onclick="downloadCSV()">تصدير CSV</button></div></div><div id="biOut"></div></section><section id="admin"><div class="card"><div class="row"><input id="adminUser" placeholder="Admin Access Token" style="min-width:310px"><button class="primary" onclick="loadAdmin()">تحديث لوحة الإدارة</button><button class="small" onclick="dispatch()">تشغيل التوزيع</button></div></div><div id="adminOut"></div></section><section id="live" hidden><div class="card"><div class="row"><input id="liveUser" placeholder="Admin Access Token" style="min-width:310px"><button class="primary" onclick="loadLive()">تحديث الطلبات الحية</button><label><input type="checkbox" id="autoRefresh" onchange="toggleRefresh()"> تحديث تلقائي كل 10 ثوانٍ</label></div></div><div id="liveOut"></div></section><section id="zones" hidden><div class="card"><div class="row"><input id="zoneUser" placeholder="Admin Access Token" style="min-width:310px"><button class="primary" onclick="loadZones()">تحميل المناطق</button></div></div><div id="zonesOut"></div></section><section id="merchant" hidden><div class="card"><div class="row"><input id="merchantUser" placeholder="Merchant Access Token" style="min-width:260px"><input id="merchantId" placeholder="Merchant ID" style="min-width:300px"><button class="primary" onclick="loadMerchant()">تحميل</button></div></div><div id="merchantOut"></div></section><section id="rider" hidden><div class="card"><div class="row"><input id="riderUser" placeholder="Rider Access Token" style="min-width:300px"><button class="primary" onclick="loadRider()">تحديث</button></div></div><div id="riderOut"></div></section></main><script>const API=location.origin+'/api/v1';function authHeaders(v){const x=String(v||'').trim();return x?{'Authorization':x.startsWith('Bearer ')?x:'Bearer '+x}:{} }async function api(path,opt={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok)throw Error(await r.text());return r.json()}function show(id,b){for(const x of ['admin','bi','live','zones','merchant','rider'])document.getElementById(x).hidden=x!==id;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}

let refreshTimer=null;
async function loadLive(){try{const h=authHeaders(liveUser.value||adminUser.value);const o=await api('/admin/orders',{headers:h});const active=o.filter(x=>!['DELIVERED','CANCELLED','REJECTED','REFUNDED','PAYMENT_FAILED'].includes(x.status));liveOut.innerHTML=`<div class="grid">${['CREATED','CONFIRMED','ACCEPTED_BY_MERCHANT','PREPARING','READY_FOR_PICKUP','ASSIGNED_RIDER','PICKED_UP','ON_THE_WAY'].map(st=>`<div class="card"><div class="metric">${active.filter(x=>x.status===st).length}</div>${st}</div>`).join('')}</div><div class="section"><table><tr><th>الطلب</th><th>المتجر</th><th>الحالة</th><th>الإجمالي</th><th>الوقت</th></tr>${active.map(x=>`<tr><td>${x.id.slice(0,8)}</td><td>${x.merchant_name||'-'}</td><td><span class="pill">${x.status}</span></td><td>${x.total}</td><td>${x.created_at||'-'}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد طلبات نشطة</td></tr>'}</table></div>`}catch(e){liveOut.innerHTML='<div class="card danger">'+e.message+'</div>'}}
function toggleRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=autoRefresh.checked?setInterval(loadLive,10000):null;if(autoRefresh.checked)loadLive()}
async function loadZones(){try{const h=authHeaders(zoneUser.value||adminUser.value);const r=await api('/admin/delivery-zones',{headers:h});const zones=Array.isArray(r)?r:(r.zones||[]);zonesOut.innerHTML=`<div class="grid">${zones.map(z=>`<div class="card"><h3>${z.name}</h3><div class="muted">${z.village||z.center_name||''}</div><p>نطاق: ${z.radius_km||z.radiusKm||'-'} كم</p><p>الرسوم الأساسية: ${z.base_fee||z.baseFee||'-'} ج.م</p><p>لكل كم: ${z.per_km_fee||z.perKmFee||'-'} ج.م</p><span class="pill">${z.is_active===false?'غير نشطة':'نشطة'}</span></div>`).join('')||'<div class="card">لا توجد مناطق.</div>'}</div>`}catch(e){zonesOut.innerHTML='<div class="card danger">تعذر تحميل المناطق: '+e.message+'</div>'}}
let lastBI=null;
async function loadBI(){try{const h=authHeaders(biUser.value||adminUser.value);lastBI=await api('/admin/analytics?days='+biDays.value,{headers:h});const s=lastBI.summary;biOut.innerHTML=`<div class="grid"><div class="card"><div class="metric">${s.orders}</div>إجمالي الطلبات</div><div class="card"><div class="metric">${s.delivered}</div>تم التسليم</div><div class="card"><div class="metric">${Number(s.revenue).toFixed(2)}</div>ج.م مبيعات</div><div class="card"><div class="metric">${Number(s.platformCommission).toFixed(2)}</div>ج.م عمولة المنصة</div><div class="card"><div class="metric">${Number(s.delivery_revenue).toFixed(2)}</div>ج.م توصيل</div></div><div class="section"><h2>المبيعات اليومية</h2><table><tr><th>اليوم</th><th>الطلبات</th><th>تم التسليم</th><th>المبيعات</th></tr>${lastBI.daily.map(x=>`<tr><td>${x.day}</td><td>${x.orders}</td><td>${x.delivered}</td><td>${x.revenue}</td></tr>`).join('')}</table></div><div class="section"><h2>أداء المتاجر</h2><table><tr><th>المتجر</th><th>القرية</th><th>طلبات</th><th>تسليم</th><th>مبيعات</th><th>متوسط الطلب</th></tr>${lastBI.merchants.map(x=>`<tr><td>${x.name}</td><td>${x.village||'-'}</td><td>${x.orders}</td><td>${x.delivered}</td><td>${x.revenue}</td><td>${Number(x.avg_order_value).toFixed(2)}</td></tr>`).join('')}</table></div><div class="section"><h2>أداء الكباتن</h2><table><tr><th>الكابتن</th><th>متصل</th><th>مهام</th><th>تسليمات</th><th>رسوم توصيل</th><th>آخر تسليم</th></tr>${lastBI.riders.map(x=>`<tr><td>${x.name||x.phone||'-'}</td><td>${x.is_online?'نعم':'لا'}</td><td>${x.deliveries}</td><td>${x.delivered}</td><td>${x.delivery_fees}</td><td>${x.last_delivery||'-'}</td></tr>`).join('')}</table></div><div class="section"><h2>المناطق</h2><table><tr><th>المنطقة</th><th>نشطة</th><th>طلبات</th><th>تسليم</th><th>مبيعات</th></tr>${lastBI.zones.map(x=>`<tr><td>${x.name}</td><td>${x.is_active?'نعم':'لا'}</td><td>${x.orders}</td><td>${x.delivered}</td><td>${x.revenue}</td></tr>`).join('')}</table></div>`}catch(e){biOut.innerHTML='<div class="card danger">تعذر تحميل التقارير: '+e.message+'</div>'}}
async function downloadCSV(){try{const h=authHeaders(biUser.value||adminUser.value);const r=await fetch(API+'/admin/analytics/csv?days='+biDays.value,{headers:h});if(!r.ok)throw Error(await r.text());const blob=new Blob([await r.text()],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jayek-sales-'+biDays.value+'d.csv';a.click();URL.revokeObjectURL(a.href)}catch(e){alert(e.message)}}
async function loadAdmin(){try{const h=authHeaders(adminUser.value);const [m,ms,o,t]=await Promise.all([api('/admin/metrics',{headers:h}),api('/admin/merchants',{headers:h}),api('/admin/orders',{headers:h}),api('/admin/support/tickets',{headers:h})]);adminOut.innerHTML=`<div class="grid"><div class="card"><div class="metric">${m.users}</div>مستخدم</div><div class="card"><div class="metric">${m.merchants}</div>متجر</div><div class="card"><div class="metric">${m.orders}</div>طلب</div><div class="card"><div class="metric">${m.delivered}</div>تم التسليم</div><div class="card"><div class="metric">${m.revenue}</div>ج.م مبيعات مسلمة</div></div><div class="section"><h2>المتاجر</h2><table><tr><th>المتجر</th><th>القرية</th><th>المنتجات</th><th>التقييم</th></tr>${ms.map(x=>`<tr><td>${x.name}</td><td>${x.village}</td><td>${x.product_count}</td><td>${x.rating}</td></tr>`).join('')}</table></div><div class="section"><h2>آخر الطلبات</h2><table><tr><th>رقم</th><th>المتجر</th><th>الحالة</th><th>الإجمالي</th></tr>${o.map(x=>`<tr><td>${x.id.slice(0,8)}</td><td>${x.merchant_name}</td><td><span class="pill">${x.status}</span></td><td>${x.total}</td></tr>`).join('')}</table></div><div class="section"><h2>الدعم</h2><table><tr><th>الموضوع</th><th>العميل</th><th>الحالة</th><th>الإجراء</th></tr>${t.map(x=>`<tr><td>${x.subject}</td><td>${x.user_name||x.phone}</td><td>${x.status}</td><td><button class="small" onclick="ticket('${x.id}','IN_PROGRESS')">متابعة</button> <button class="small" onclick="ticket('${x.id}','RESOLVED')">حل</button></td></tr>`).join('')}</table></div>`}catch(e){adminOut.innerHTML='<div class="card danger">'+e.message+'</div>'}}
async function ticket(id,status){await api('/admin/support/tickets/'+id,{method:'PATCH',headers:authHeaders(adminUser.value),body:JSON.stringify({status})});loadAdmin()}async function dispatch(){try{const r=await api('/admin/dispatch/run',{method:'POST',headers:authHeaders(adminUser.value)});alert('تم توزيع '+r.count+' طلب');loadAdmin()}catch(e){alert(e.message)}}
async function loadMerchant(){try{const h=authHeaders(merchantUser.value);const d=await api('/merchant/dashboard/'+merchantId.value,{headers:h});merchantOut.innerHTML=`<div class="grid"><div class="card"><div class="metric">${d.stats.orders}</div>طلبات</div><div class="card"><div class="metric">${d.stats.active}</div>نشطة</div><div class="card"><div class="metric">${d.stats.delivered}</div>تم التسليم</div><div class="card"><div class="metric">${d.stats.revenue}</div>ج.م</div></div><div class="section"><h2>الطلبات</h2><table><tr><th>الطلب</th><th>العميل</th><th>الحالة</th><th>الإجمالي</th><th>الإجراء</th></tr>${d.orders.map(x=>`<tr><td>${x.id.slice(0,8)}</td><td>${x.customer_name||x.customer_phone}</td><td>${x.status}</td><td>${x.total}</td><td><button class="small" onclick="merchantNext('${x.id}','${x.status}')">التالي</button></td></tr>`).join('')}</table></div><div class="section"><h2>المنتجات</h2><table><tr><th>المنتج</th><th>السعر</th><th>متاح</th><th>الطلبات</th></tr>${d.products.map(x=>`<tr><td>${x.name}</td><td>${x.price}</td><td>${x.is_available?'نعم':'لا'}</td><td>${x.order_count}</td></tr>`).join('')}</table></div>`}catch(e){merchantOut.innerHTML='<div class="card danger">'+e.message+'</div>'}}
async function merchantNext(id,status){const map={CREATED:'ACCEPTED_BY_MERCHANT',CONFIRMED:'ACCEPTED_BY_MERCHANT',ACCEPTED_BY_MERCHANT:'PREPARING',PREPARING:'READY_FOR_PICKUP'};if(!map[status])return alert('لا يوجد انتقال لهذه الحالة');await api('/merchant/orders/'+merchantId.value+'/'+id+'/status',{method:'PATCH',headers:authHeaders(merchantUser.value),body:JSON.stringify({status:map[status]})});loadMerchant()}
async function loadRider(){try{const h=authHeaders(riderUser.value);const [me,tasks]=await Promise.all([api('/rider/me',{headers:h}),api('/rider/tasks/available',{headers:h})]);riderOut.innerHTML=`<div class="card"><h2>${me?.name||'الكابتن'}</h2><div class="row"><span class="pill">${me?.is_online?'متصل':'غير متصل'}</span><button class="small" onclick="online(${!me?.is_online})">${me?.is_online?'إيقاف الاتصال':'بدء الاتصال'}</button></div></div><div class="grid">${tasks.map(x=>`<div class="card"><h3>${x.merchant_name}</h3><div>${x.village}</div><div>${x.total} ج.م</div><div class="muted">${x.status}</div><br>${x.status==='READY_FOR_PICKUP'?`<button class="primary" onclick="accept('${x.id}')">استلام المهمة</button>`:`<button class="small" onclick="rstatus('${x.id}','${x.status}')">تحديث الحالة</button>`}</div>`).join('')||'<div class="card">لا توجد مهام الآن</div>'}</div>`}catch(e){riderOut.innerHTML='<div class="card danger">'+e.message+'</div>'}}
async function online(v){await api('/rider/online',{method:'PATCH',headers:authHeaders(riderUser.value),body:JSON.stringify({online:v})});loadRider()}async function accept(id){await api('/rider/tasks/'+id+'/accept',{method:'POST',headers:authHeaders(riderUser.value)});loadRider()}async function rstatus(id,status){const n={ASSIGNED_RIDER:'PICKED_UP',PICKED_UP:'ON_THE_WAY',ON_THE_WAY:'DELIVERED'}[status];if(n){await api('/rider/orders/'+id+'/status',{method:'PATCH',headers:authHeaders(riderUser.value),body:JSON.stringify({status:n})});loadRider()}}</script></body></html>
